[package]
name = "eq-cli"
description = "Play Equilibrium in a terminal."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "equilibrium"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
eq-game = { path = "../eq-game" }
eq-protocol = { path = "../eq-protocol" }
tungstenite = "0.26"

[dev-dependencies]
eq-server = { path = "../eq-server" }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
