[package]
name = "eq-nodes"
description = "Resource nodes that regrow, and wear out when over-harvested."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Lets its types be saved: they read and write with serde.
serde = ["dep:serde", "eq-meter/serde"]

[lints]
workspace = true

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
eq-meter = { path = "../eq-meter" }
