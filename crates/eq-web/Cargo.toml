[package]
name = "eq-web"
description = "Equilibrium for the browser: the game compiled to WebAssembly, with a scene to draw."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
eq-clock = { path = "../eq-clock" }
eq-game = { path = "../eq-game" }
eq-nodes = { path = "../eq-nodes" }
eq-world-graph = { path = "../eq-world-graph" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned: the wasm-bindgen CLI that CI downloads must be exactly this version.
wasm-bindgen = "=0.2.130"

[dev-dependencies]
eq-events = { path = "../eq-events" }
