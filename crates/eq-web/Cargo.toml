[package]
name = "eq-web"
description = "Equilibrium for the browser: the game compiled to WebAssembly, with a scene to draw."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
eq-game = { path = "../eq-game" }
eq-scene = { path = "../eq-scene" }
serde_json = "1"
# Pinned: the wasm-bindgen CLI that CI downloads must be exactly this version.
wasm-bindgen = "=0.2.130"
