[package]
name = "eq-game"
description = "The first playable build: one character on the Rocky Shoreline."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
eq-clock = { path = "../eq-clock" }
eq-events = { path = "../eq-events" }
eq-ids = { path = "../eq-ids" }
eq-meter = { path = "../eq-meter" }
eq-naming = { path = "../eq-naming" }
eq-nodes = { path = "../eq-nodes" }
eq-rng = { path = "../eq-rng" }
eq-skills = { path = "../eq-skills" }
eq-curve = { path = "../eq-curve" }
eq-world-graph = { path = "../eq-world-graph" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }

[features]
# Lets commands be saved and sent: `Command` and `Action` read and write with serde.
serde = ["dep:serde"]

[dev-dependencies]
eq-rng = { path = "../eq-rng" }
