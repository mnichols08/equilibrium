[package]
name = "eq-scene"
description = "What one character can see of an Equilibrium world, as plain data a client can draw."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
eq-clock = { path = "../eq-clock" }
eq-game = { path = "../eq-game" }
eq-nodes = { path = "../eq-nodes" }
eq-world-graph = { path = "../eq-world-graph" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
eq-events = { path = "../eq-events" }
