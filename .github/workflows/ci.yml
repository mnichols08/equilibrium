name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Must match the wasm-bindgen version pinned in crates/eq-web/Cargo.toml.
  WASM_BINDGEN_VERSION: 0.2.130

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The terminal client, the server and the on-disk store are native only; everything else must also build for wasm.
      - run: cargo build --workspace --exclude eq-cli --exclude eq-server --exclude eq-store --target wasm32-unknown-unknown

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - name: Check and test the page
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test

      - name: Build the game as WebAssembly
        run: |
          cargo build -p eq-web --release --target wasm32-unknown-unknown
          curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz
          "wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" \
            --target web --out-dir web/dist/pkg \
            target/wasm32-unknown-unknown/release/eq_web.wasm

      - name: Build the site
        working-directory: web
        run: npm run build

      - name: Play the built site in a real browser
        run: |
          cp web/test/e2e.html web/dist/e2e.html
          python3 -m http.server 8080 --directory web/dist >/dev/null 2>&1 &
          sleep 1
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=30000 \
            --dump-dom http://localhost:8080/e2e.html > e2e.out 2>/dev/null
          rm web/dist/e2e.html
          # Print the verdict (and, on failure, what passed before it).
          awk '/<pre id="result">/ {show = 1} show {print} /<\/pre>/ {exit}' e2e.out
          grep -q 'E2E PASS' e2e.out

      - name: Play a shared world in a real browser
        run: |
          cargo build -p eq-server --release
          cp web/test/e2e-online.html web/dist/e2e-online.html
          ./target/release/equilibrium-server --tick-ms 20 --data "$RUNNER_TEMP/realm" --bots 4 &
          node web/tools/serve.js web/dist 8081 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --dump-dom http://localhost:8081/e2e-online.html > e2e-online.out 2>/dev/null
          rm web/dist/e2e-online.html
          awk '/<pre id="result">/ {show = 1} show {print} /<\/pre>/ {exit}' e2e-online.out
          grep -q 'E2E PASS' e2e-online.out

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist
          retention-days: 14

      - name: Hand the site to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  # Publishes the site built above. Only for main, and only once every check has passed.
  # Needs Settings > Pages > Source set to "GitHub Actions".
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
