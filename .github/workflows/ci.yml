name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Must match the wasm-bindgen version pinned in crates/eq-web/Cargo.toml.
  WASM_BINDGEN_VERSION: 0.2.130

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The terminal client is native only; everything it is built from must also build for wasm.
      - run: cargo build --workspace --exclude eq-cli --target wasm32-unknown-unknown

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - name: Check and test the page
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test

      - name: Build the game as WebAssembly
        run: |
          cargo build -p eq-web --release --target wasm32-unknown-unknown
          curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz
          "wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" \
            --target web --out-dir web/dist/pkg \
            target/wasm32-unknown-unknown/release/eq_web.wasm

      - name: Build the site
        working-directory: web
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist
          retention-days: 14
